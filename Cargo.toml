[package]
name = "ssh-m8"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small native macOS app for SSH hosts and port forwarding"
license = "MIT"
authors = ["apps-m8"]
repository = "https://github.com/apps-m8/ssh-m8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry", "NSDictionary"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSAccessibilityProtocols", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSResponder", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSBezierPath", "NSColor", "NSFont", "NSFontDescriptor", "NSAttributedString", "NSStringDrawing"] }

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
security-framework = "3"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
